<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Tracker · Donation review</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>Donating &amp; Getting Approved — proof to supporter perk</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="att-donation-title att-donation-desc">
        <title id="att-donation-title">Donation and admin review journey</title>
        <desc id="att-donation-desc">A donor submits a payment proof which FastAPI writes to a directory outside the web root and records in PostgreSQL as pending; an admin holding a panel credential loads the review queue, and an ALT fragment shows either approval, which flips the donor's supporter status, or rejection.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- LIFELINES -->
        <line x1="112" y1="128" x2="112" y2="812" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="304" y1="128" x2="304" y2="812" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="500" y1="128" x2="500" y2="812" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="696" y1="128" x2="696" y2="812" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="888" y1="128" x2="888" y2="812" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ACTIVATION BARS -->
        <rect x="300" y="176" width="8" height="180" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="496" y="216" width="8" height="140" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="496" y="396" width="8" height="48" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="496" y="516" width="8" height="48" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="496" y="660" width="8" height="48" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- M1: Student -> SPA -->
        <line x1="112" y1="180" x2="300" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="136" y="160" width="140" height="12" rx="2" fill="#f5f5f5"/>
        <text x="206" y="169" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROOF + NAME + MESSAGE</text>

        <!-- M2: SPA -> FastAPI -->
        <line x1="308" y1="220" x2="496" y2="220" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="318" y="200" width="168" height="12" rx="2" fill="#f5f5f5"/>
        <text x="402" y="209" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /DONATIONS · MULTIPART</text>

        <!-- M3: FastAPI self-message (write file) -->
        <path d="M 500,244 H 532 Q 540,244 540,252 V 268 Q 540,276 532,276 H 500"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="548" y="254" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="604" y="263" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WRITE TO UPLOADS/</text>

        <!-- M4: FastAPI -> PostgreSQL -->
        <line x1="504" y1="312" x2="696" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="546" y="292" width="108" height="12" rx="2" fill="#f5f5f5"/>
        <text x="600" y="301" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INSERT · PENDING</text>

        <!-- M5: FastAPI -> SPA (return, dashed) -->
        <line x1="496" y1="352" x2="308" y2="352" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="360" y="332" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="402" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">202 · QUEUED</text>

        <!-- M6: Admin -> FastAPI -->
        <line x1="888" y1="400" x2="496" y2="400" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="528" y="380" width="140" height="12" rx="2" fill="#f5f5f5"/>
        <text x="598" y="389" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GET /DONATIONS/PENDING</text>

        <!-- M7: FastAPI -> Admin (return, dashed) -->
        <line x1="504" y1="440" x2="888" y2="440" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="528" y="420" width="140" height="12" rx="2" fill="#f5f5f5"/>
        <text x="598" y="429" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUEUE · PENDING PROOFS</text>

        <!-- ALT COMBINED FRAGMENT — spans FastAPI · PostgreSQL · Admin -->
        <rect x="456" y="472" width="476" height="264" rx="4"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="456" y="472" width="40" height="16" rx="2"
              fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="476" y="484" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>

        <!-- Region 1 guard -->
        <text x="468" y="492" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[approve]</text>

        <!-- M8: Admin -> FastAPI (approve) -->
        <line x1="888" y1="520" x2="496" y2="520" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="540" y="500" width="116" height="12" rx="2" fill="#f5f5f5"/>
        <text x="598" y="509" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /{id}/APPROVE</text>

        <!-- M9: FastAPI -> PostgreSQL (headline, accent) -->
        <line x1="504" y1="560" x2="696" y2="560" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="526" y="540" width="148" height="12" rx="2" fill="#f5f5f5"/>
        <text x="600" y="549" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UPDATE SUPPORTER = TRUE</text>

        <!-- alt region divider -->
        <line x1="464" y1="592" x2="924" y2="592"
              stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>

        <!-- Region 2 guard -->
        <text x="468" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[else · reject]</text>

        <!-- M11: Admin -> FastAPI (reject) -->
        <line x1="888" y1="664" x2="496" y2="664" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="542" y="644" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="598" y="653" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /{id}/REJECT</text>

        <!-- M12: FastAPI -> PostgreSQL (reject) -->
        <line x1="504" y1="704" x2="696" y2="704" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="544" y="684" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="600" y="693" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UPDATE = REJECTED</text>

        <!-- M13: SPA -> Student (perk applies) -->
        <line x1="304" y1="784" x2="112" y2="784" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="138" y="764" width="140" height="12" rx="2" fill="#f5f5f5"/>
        <text x="208" y="773" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SUPPORTER BADGE ACTIVE</text>

        <!-- ACTOR BOXES -->
        <rect x="40" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="62" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="112" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Student</text>
        <text x="112" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">donor</text>

        <rect x="232" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="232" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="240" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="254" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPA</text>
        <text x="304" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">React SPA</text>
        <text x="304" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Vite · Vercel</text>

        <rect x="428" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="428" y="72" width="144" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="436" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="450" y="89" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="500" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FastAPI</text>
        <text x="500" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">systemd · Ubuntu</text>

        <rect x="624" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="624" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="632" y="80" width="24" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="644" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="696" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL</text>
        <text x="696" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AWS · donations</text>

        <rect x="816" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="816" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="824" y="80" width="36" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="842" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADMIN</text>
        <text x="888" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Admin</text>
        <text x="888" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">panel credential</text>

        <!-- LEGEND -->
        <line x1="40" y1="844" x2="960" y2="844" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="860" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="876" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="884" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal actor</text>

        <rect x="160" y="872" width="28" height="18" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="168" y="884" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">ALT</text>
        <text x="196" y="884" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Fragment</text>

        <line x1="300" y1="881" x2="328" y2="881" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="336" y="884" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sync call</text>

        <line x1="440" y1="881" x2="468" y2="881" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="476" y="884" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP call</text>

        <line x1="570" y1="881" x2="598" y2="881" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="606" y="884" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Headline</text>

        <line x1="700" y1="881" x2="728" y2="881" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="736" y="884" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>
      </svg>
    </div>
  </div>
</body>
</html>
