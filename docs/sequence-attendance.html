<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Tracker · Attendance journey</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>The Attendance Check — what happens when you log in</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="att-journey-title att-journey-desc">
        <title id="att-journey-title">The attendance check journey</title>
        <desc id="att-journey-desc">An ALT fragment contrasts two visits: without a token the student submits portal credentials, the backend replays the college portal's login and three page requests, parses the HTML, caches it in PostgreSQL and returns a JWT plus attendance JSON, while a returning visit renders cached data instantly and refreshes it in the background.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- LIFELINES -->
        <line x1="112" y1="128" x2="112" y2="820" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="304" y1="128" x2="304" y2="820" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="500" y1="128" x2="500" y2="820" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="696" y1="128" x2="696" y2="820" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="888" y1="128" x2="888" y2="820" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ACTIVATION BARS -->
        <rect x="300" y="260" width="8" height="332" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="496" y="300" width="8" height="208" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="692" y="340" width="8" height="48" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="300" y="684" width="8" height="88" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="496" y="724" width="8" height="48" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- M1: Student -> SPA -->
        <line x1="112" y1="264" x2="300" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="138" y="244" width="136" height="12" rx="2" fill="#f5f5f5"/>
        <text x="206" y="253" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ID + PASSWORD + ALIAS</text>

        <!-- M2: SPA -> FastAPI -->
        <line x1="308" y1="304" x2="496" y2="304" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="340" y="284" width="124" height="12" rx="2" fill="#f5f5f5"/>
        <text x="402" y="293" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /SCRAPER/LOGIN</text>

        <!-- M3: FastAPI -> College ERP (headline, accent) -->
        <line x1="504" y1="344" x2="692" y2="344" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="528" y="324" width="140" height="12" rx="2" fill="#f5f5f5"/>
        <text x="598" y="333" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPLAY LOGIN + 3 PAGES</text>

        <!-- M4: College ERP -> FastAPI (return, dashed) -->
        <line x1="700" y1="384" x2="504" y2="384" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="566" y="364" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="602" y="373" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTML PAGES</text>

        <!-- M5: FastAPI self-message (parse) -->
        <path d="M 500,408 H 532 Q 540,408 540,416 V 432 Q 540,440 532,440 H 500"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="548" y="418" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="592" y="427" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PARSE TO ROWS</text>

        <!-- M6: FastAPI -> PostgreSQL -->
        <line x1="504" y1="464" x2="888" y2="464" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="542" y="444" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="598" y="453" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UPSERT ATTENDANCE</text>

        <!-- M7: FastAPI -> SPA (return, dashed) -->
        <line x1="496" y1="504" x2="308" y2="504" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="334" y="484" width="136" height="12" rx="2" fill="#f5f5f5"/>
        <text x="402" y="493" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JWT (7D) + ATTENDANCE</text>

        <!-- M8: SPA self-message (persist) -->
        <path d="M 304,528 H 336 Q 344,528 344,536 V 552 Q 344,560 336,560 H 304"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="352" y="538" width="128" height="12" rx="2" fill="#f5f5f5"/>
        <text x="416" y="547" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SAVE TO LOCALSTORAGE</text>

        <!-- M9: SPA -> Student -->
        <line x1="300" y1="584" x2="112" y2="584" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="148" y="564" width="116" height="12" rx="2" fill="#f5f5f5"/>
        <text x="206" y="573" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RENDER + TIMETABLE</text>

        <!-- ALT COMBINED FRAGMENT — spans all five lifelines -->
        <rect x="56" y="180" width="888" height="620" rx="4"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="56" y="180" width="40" height="16" rx="2"
              fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="76" y="192" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>

        <!-- Region 1 guard -->
        <text x="68" y="216" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[no valid token · first visit]</text>

        <!-- alt region divider -->
        <line x1="64" y1="616" x2="936" y2="616"
              stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>

        <!-- Region 2 guard -->
        <text x="68" y="640" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[token valid · returning visit]</text>

        <!-- M10: SPA -> Student (cached render) -->
        <line x1="300" y1="688" x2="112" y2="688" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="148" y="668" width="116" height="12" rx="2" fill="#f5f5f5"/>
        <text x="206" y="677" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INSTANT FROM CACHE</text>

        <!-- M11: SPA -> FastAPI (background refresh) -->
        <line x1="308" y1="728" x2="496" y2="728" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="334" y="708" width="136" height="12" rx="2" fill="#f5f5f5"/>
        <text x="402" y="717" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GET /FETCH_ATTENDANCE</text>

        <!-- M12: FastAPI -> SPA (return, dashed) -->
        <line x1="496" y1="768" x2="308" y2="768" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="340" y="748" width="124" height="12" rx="2" fill="#f5f5f5"/>
        <text x="402" y="757" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JSON · SWAP IN VIEW</text>

        <!-- ACTOR BOXES -->
        <rect x="40" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="62" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="112" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Student</text>
        <text x="112" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">browser · phone</text>

        <rect x="232" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="232" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="240" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="254" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPA</text>
        <text x="304" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">React SPA</text>
        <text x="304" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Vite · Vercel</text>

        <rect x="428" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="428" y="72" width="144" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="436" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="450" y="89" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="500" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FastAPI</text>
        <text x="500" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">systemd · Ubuntu</text>

        <rect x="624" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="624" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="632" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="646" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="696" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">College ERP</text>
        <text x="696" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no public API</text>

        <rect x="816" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="816" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="824" y="80" width="24" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="836" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="888" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL</text>
        <text x="888" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AWS · cache</text>

        <!-- LEGEND -->
        <line x1="40" y1="844" x2="960" y2="844" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="860" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="876" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="884" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal actor</text>

        <rect x="160" y="872" width="28" height="18" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="168" y="884" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">ALT</text>
        <text x="196" y="884" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Fragment</text>

        <line x1="300" y1="881" x2="328" y2="881" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="336" y="884" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sync call</text>

        <line x1="440" y1="881" x2="468" y2="881" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="476" y="884" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP call</text>

        <line x1="570" y1="881" x2="598" y2="881" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="606" y="884" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Headline</text>

        <line x1="700" y1="881" x2="728" y2="881" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="736" y="884" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>
      </svg>
    </div>
  </div>
</body>
</html>
