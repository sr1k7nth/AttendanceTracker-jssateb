name: Auto Deploy Backend

on:
  push:
    branches:
      # Deploys this branch directly instead of main. When the work is merged,
      # flip this ref AND the fetch/checkout/pull refs below back to `main`.
      - scrape-http-no-limits

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/AttendanceTracker-jssateb
            git fetch origin
            git checkout scrape-http-no-limits
            git pull --ff-only origin scrape-http-no-limits
            source venv/bin/activate
            cd backend
            pip install -r requirements.txt
            PYTHONPATH=. /home/ubuntu/AttendanceTracker-jssateb/venv/bin/alembic upgrade head
            sudo systemctl restart fastapi
